name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare evidence for this run
        run: |
          mkdir -p .ci-results
          node --input-type=module -e "import { rmSync } from 'node:fs'; rmSync('docs/package-verification.json', { force: true });"
          node --version | tee .ci-results/environment.log
          npm --version | tee -a .ci-results/environment.log
          git --version | tee -a .ci-results/environment.log
      # Explicit bash uses -eo pipefail: tee must never turn a failed check into success.
      - name: Install locked dependencies
        run: npm ci 2>&1 | tee .ci-results/install.log
      - name: Strict typecheck
        run: npm run typecheck 2>&1 | tee .ci-results/typecheck.log
      - name: Full test suite
        run: npm test -- --reporter=default --reporter=junit --outputFile=.ci-results/junit.xml 2>&1 | tee .ci-results/tests.log
      - name: Build
        run: npm run build 2>&1 | tee .ci-results/build.log
      - name: Inspect package
        run: npm pack --dry-run 2>&1 | tee .ci-results/pack.log
      - name: Install and test exact tarball outside checkout
        run: npm run test:package 2>&1 | tee .ci-results/consumer.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .ci-results/*.log
            .ci-results/junit.xml
            docs/package-verification.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
